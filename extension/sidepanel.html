<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InforSure</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="appbar-inner">
        <div class="brand">
          <span class="logo-tile" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z" />
              <path d="M9 12l2 2 4-4" />
            </svg>
          </span>
          <div class="brand-text">
            <h1>InforSure</h1>
            <p class="tagline" data-i18n="tagline"></p>
          </div>
        </div>
        <div class="appbar-actions">
          <div class="lang" role="group" aria-label="Language">
            <button type="button" id="lang-en" data-lang="en">EN</button>
            <button type="button" id="lang-tl" data-lang="tl">TL</button>
          </div>
          <button type="button" id="theme-toggle" class="icon-btn">
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="page">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-text" data-tab="text" data-i18n="tabText"></button>
        <button type="button" role="tab" id="tab-image" data-tab="image" data-i18n="tabImage"></button>
      </div>

      <section class="card input-card" id="text-card">
        <label class="field-label" for="text" data-i18n="inputLabel"></label>
        <textarea
          id="text"
          rows="4"
          maxlength="5000"
          data-i18n-placeholder="inputPlaceholder"
        ></textarea>
        <div id="connection" class="conn" aria-live="polite"></div>
        <button id="check" type="button" class="btn-primary">
          <span data-i18n="check"></span>
        </button>
      </section>

      <section class="card input-card" id="image-card" hidden>
        <p class="field-label" data-i18n="imageLabel"></p>
        <div id="image-notice" class="notice-inline" hidden>
          <p data-i18n="imagePrivacy"></p>
          <button type="button" id="image-accept" class="btn-outline" data-i18n="imageAccept"></button>
        </div>
        <div class="dropzone" id="dropzone">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4" /><path d="M7 9l5-5 5 5" /><path d="M4 16v4h16v-4" /></svg>
          <strong data-i18n="dropTitle"></strong>
          <span data-i18n="imageHint"></span>
        </div>
      </section>

      <section class="card input-card" id="ocr-card" hidden>
        <div class="ocr-row">
          <img id="ocr-preview" alt="" />
          <div class="ocr-main">
            <textarea id="ocr-text" rows="5" maxlength="5000"></textarea>
          </div>
        </div>
        <p id="ocr-warning" class="warn-line" hidden></p>
        <div class="ocr-buttons">
          <button type="button" id="ocr-recheck" class="btn-primary" data-i18n="ocrRecheck"></button>
          <button type="button" id="ocr-new" class="btn-outline" data-i18n="ocrNew"></button>
        </div>
      </section>

      <div id="status" role="status" aria-live="polite" hidden></div>
      <main id="result" data-state="empty" aria-live="polite"></main>

      <footer data-i18n="footer"></footer>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
